# 复制为 config.toml。下列学期日期、节次时间仅作示例，请按实际校历修改。
timezone = "Asia/Shanghai"
# 相对于配置文件所在目录；建议生产环境改成绝对路径。
state_dir = "state"

[semester]
start_monday = "2026-09-07"
weeks = 20

[window]
mode = "course" # course：整段课程；period：每小节分别建立窗口
before = "10m"
after = "5m"

[poll]
interval = "10s"
page_size = 10
max_pages = 100
timeout = "15s"
backoff_max = "5m"

[ucloud]
# 默认使用登录响应 user_id。请用 check 核对，必要时明确填写收件人 ID。
account_id = ""
identity = "JS005:undefined"
tenant_id = "000000"

[notify]
# 只保存环境变量名称，Webhook 密钥不要写进本文件。
webhook_env = "BUPTWC_WEBHOOK"
ttl = "30m"
max_attempts = 6
retry_base = "5s"
retry_max = "5m"
timeout = "10s"

