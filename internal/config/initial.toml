# buptwc 配置。先填写第一教学周的周一，再导入课表。
# Webhook 使用 BUPTWC_WEBHOOK 环境变量，不要写入本文件。
timezone = "Asia/Shanghai"
# 相对于本配置文件目录解析；可改为绝对路径。
state_dir = "state"

[semester]
# 必填，格式 YYYY-MM-DD；请按实际校历填写，不是今天的日期。
start_monday = ""
weeks = 20

[window]
mode = "course"
before = "10m"
after = "5m"

# 以下为示例节次时间，请按校区和学期作息核对。
